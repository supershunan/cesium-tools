# See npm-publish.yml — publish runs only on version tags

name: Node.js Package

on:
    push:
        branches:
            - master
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - master
            - main

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build

    publish-npm:
        needs: verify
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
